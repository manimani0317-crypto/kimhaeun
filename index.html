<!--
  메인 화면 — 책상을 위에서 내려다본 장면.

  두 곳에서 가져와 합쳤다.
    조명 · 명암 · 색감   예전 인덱스(시연용 책상) 그대로 — 환경 반사, 왼쪽 위 주광과 부드러운 그림자,
                         배경이 비치는 책상. 펠트 책상·안개는 쓰지 않는다
    구도 · 인터랙션      메인 장면(assets/main/mainScene) — 오브젝트 자리(SLOTS), 책상 뷰·고개 든 뷰(VIEW),
                         커서를 화면 위쪽으로 올리면 고개를 들어 미싱이 보이는 동작, 글자·목록·빨간 점 커서

  자리값은 mainScene.js 에서 읽어만 온다 — 자리를 옮기려면 거기 SLOTS·VIEW 를 고친다.
  메인 장면은 1 = 1cm, 오브젝트 모델은 1 = 1mm 라서 자리값을 10 배(K)로 옮겨 쓴다.

  오브젝트
    바늘꽂이  통통 튀고 진주핀이 들린다. 누르면 진주핀이 코처럼 꽂힌 뒤 페이지로
    줄자      들리면서 띠가 풀린다
    실패      앞으로 살짝 굴렀다가 돌아온다
    단추      들리고, 커서 쪽으로 기울고, 광이 한 번 지나간다
    미싱      책상 안쪽 끝 — 고개를 들어야 보인다. 천천히 바느질한다
  아직 없는 자리(재단가위·원단 스와치·거울)는 M 키로 자리 표시를 켜 볼 수 있다.

  주의: type="module" 이라 file:// 로 바로 열면 안 된다. 정적 서버로 띄운다.  예) npx serve
-->

<!-- 폰트 — Figma 메인 프레임과 같은 것.

     Cormorant Garamond 는 Google Fonts, Pretendard 는 눈누(jsDelivr) — 아래 @font-face -->

<style>
  @font-face {
    font-family: "Digital Numbers";
    /* Stephan Ahlf, 2015. 가벼운 순서로 — woff2(5KB) → woff(8KB) → ttf(21KB) */
    src: url("assets/fonts/DigitalNumbers-Regular.woff2") format("woff2"),

  @font-face { font-family: 'Pretendard'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Thin.woff2') format('woff2'); font-weight: 100; font-display: swap; }
  @font-face { font-family: 'Pretendard'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-ExtraLight.woff2') format('woff2'); font-weight: 200; font-display: swap; }

  @font-face { font-family: 'Pretendard'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }

  /* ── Figma 메인 프레임(1920 × 1080) 그대로 ─────────────────────
     Figma 의 px 좌표를 그대로 적고, 묶음마다 붙어 있는 모서리를 기준으로 같은 비율(--u)로 줄인다.

  .menuText span {

  /* ── 고개 들기 안내 ── */

<script type="module">
  import { SLOTS, VIEW } from './assets/main/mainScene/mainScene.js';
  import { createSewingMachine } from './assets/main/sewingMachine/sewingMachine.js';
  import { createRedButton, createCreamButton, createButtonRig } from './assets/main/button/buttonFinal.js';
  import { createThreadSpool } from './assets/main/threadSpool/threadSpool.js';
  import { createPinCushion } from './assets/main/pinCushion/pinCushion.js';
  import { createTapeMeasure } from './assets/main/tapeMeasure/tapeMeasure.js';
  import { createGuideBook } from './assets/main/guide/guideBook.js';

  const stage = document.getElementById('stage');
  const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
  const instant = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* 메인 장면(1 = 1cm) → 오브젝트(1 = 1mm) */
  const K = 10;
  const slot = id => SLOTS.find(s => s.id === id);
  /* 자리값 — mainScene 의 placement() 와 같은 셈. nativeRadius 는 그 모델의 기준 반지름 */
  const place = (id, nativeRadius = 1) => {
    const s = slot(id);
    return { x: s.x * K, z: s.z * K, size: (s.dia / 2) * K / nativeRadius };
  };

  /* ── 렌더러 · 조명 — 예전 인덱스 그대로 ─────────────── */
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = .95;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(VIEW.DESK.fov, 1, 5, 8000);

  (function environment() {
    const c = document.createElement('canvas');
    c.width = 64; c.height = 256;
    const g = c.getContext('2d');
    const gr = g.createLinearGradient(0, 0, 0, 256);
    gr.addColorStop(0, '#6a6460'); gr.addColorStop(.3, '#fff8ee');
    gr.addColorStop(.45, '#8a8480'); gr.addColorStop(.65, '#2a2624'); gr.addColorStop(1, '#0e0c0c');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 256);
    const tex = new THREE.CanvasTexture(c);
    tex.mapping = THREE.EquirectangularReflectionMapping;
    const pm = new THREE.PMREMGenerator(renderer);
    scene.environment = pm.fromEquirectangular(tex).texture;
    pm.dispose(); tex.dispose();
  })();

  scene.add(new THREE.HemisphereLight(0xffffff, 0x2a2220, .35));
  const key = new THREE.DirectionalLight(0xfff2e4, 3.2);          // 왼쪽 위에서
  key.position.set(-420, 700, 380);
  key.target.position.set(0, 0, -150);                             // 책상 앞쪽부터 미싱까지 그림자가 닿게
  scene.add(key.target);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  Object.assign(key.shadow.camera, { left: -620, right: 620, top: 620, bottom: -620, near: 100, far: 2600 });
  key.shadow.bias = -.0012;
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xffe8e0, .45);
  fill.position.set(400, 250, 600);
  scene.add(fill);

  /* 그림자를 받는 책상 — 색은 배경이 비치게 투명, 그림자만 */
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000), new THREE.ShadowMaterial({ opacity: .35 }));
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  const castShadows = root => root.traverse(o => {
    if (o.isMesh && !o.material.transparent) o.castShadow = true;   // 가짜 그림자 판(투명)은 빼고
  });

  /* ── 오브젝트를 자리에 놓는다 ─────────────────────────
     목록·호버에서 쓰도록 자리 id 마다 { hit, setHover, lean?, update, open? } 로 모은다 */
  const placed = new Map();                               // id → [오브젝트…] (단추 자리는 둘)

  /* 바늘꽂이 — 몸통+귀 폭이 약 2.6 이라 기준 반지름 1.3 */
  const pc = place('pinCushion', 1.3);
  const cushion = new THREE.Group();
  const pinCushion = createPinCushion(THREE);
  cushion.add(pinCushion.root);
  cushion.position.set(pc.x, 0, pc.z);
  cushion.rotation.y = .28;
  cushion.scale.setScalar(pc.size);
  castShadows(pinCushion.root);
  scene.add(cushion);
  const PIN_LINK = null;                                   // 왈가왈BOT 페이지가 생기면 주소를 넣는다
  placed.set('pinCushion', [{
    hit: pinCushion.hitTarget, setHover: on => pinCushion.setHover(on), update: dt => pinCushion.update(dt),
    open: done => pinCushion.activate(() => {
      if (PIN_LINK) { location.href = PIN_LINK; return; }
      setTimeout(() => { pinCushion.reset(); done(); }, 1200);   // 페이지가 없으면 잠시 뒤 되돌린다
    })
  }]);

  /* 줄자 */
  const tape = createTapeMeasure(THREE, scene, { ...place('tapeMeasure'), turn: -.5 });
  castShadows(tape.root);
  placed.set('tapeMeasure', [{ hit: tape.hitTarget, setHover: on => tape.setHover(on), lean: p => tape.lean(p), update: dt => tape.update(dt) }]);

  /* 실패 — 길쭉해서 끝판 반지름 대신 전체 길이가 자리에 맞도록 1.27 (메인 장면과 같다) */
  const spool = createThreadSpool(THREE, scene, { ...place('threadSpool', 1.27), turn: -.35 });
  placed.set('threadSpool', [{ hit: spool.hitTarget, setHover: on => spool.setHover(on), update: dt => spool.update(dt) }]);

  /* 단추 — 빨간 단추와 꽃단추가 한 자리에. 따로 걸려서 올린 쪽만 반응한다 */
  const bp = place('button');
  const redButton = createButtonRig(THREE, scene, createRedButton(THREE), { ...bp, spin: .3 });
  const flowerButton = createButtonRig(THREE, scene, createCreamButton(THREE), {
    x: bp.x + bp.size * 1.2, z: bp.z + bp.size * 2.6, size: bp.size * .8, spin: 1.1
  });
  placed.set('button', [redButton, flowerButton].map(b => ({
    hit: b.group, setHover: on => b.setHover(on), lean: p => b.lean(p), update: dt => b.update(dt)
  })));

  /* 안내서 — 책상 맨 앞 왼쪽. 원점이 닫힌 책의 왼쪽 모서리라 자리 가운데에서 반 폭만큼 뺀다 */
  const GUIDE_W = 200;
  const ms = slot('manual');
  const guide = createGuideBook(THREE, { x: ms.x * K - GUIDE_W / 2, z: ms.z * K, width: GUIDE_W, turn: .04 });
  scene.add(guide.root);
  placed.set('manual', [{ hit: guide.hitTarget, setHover: on => guide.setHover(on), update: dt => guide.update(dt) }]);

  /* 미싱 — 책상 안쪽 끝. 원점이 왼쪽 뒤 바닥 모서리(폭 400 · 깊이 150)라 가운데를 자리에 맞춘다.
     고무발이 책상에 닿게 11.5 올린다. 메인 장면이 잡아 둔 자리는 폭 30cm 라서 0.75 배 —
     실측(40cm)대로 두면 고개를 들었을 때 화면 위로 넘친다 */
  const MACHINE = { x: 6 * K, z: -50 * K, scale: .75 };   // mainScene 의 BACKDROP 미싱 자리
  const sewing = createSewingMachine(THREE, { sewSpeed: 2.2 });
  sewing.machine.scale.setScalar(MACHINE.scale);
  sewing.machine.position.set(MACHINE.x - 200 * MACHINE.scale, 11.5 * MACHINE.scale, MACHINE.z - 75 * MACHINE.scale);
  scene.add(sewing.machine);

  /* ── 아직 없는 자리 — M 키로 켜 보는 표시 (가는 빨간 원 + 이름) ── */
  const markers = new THREE.Group();
  markers.visible = false;
  scene.add(markers);
  for (const s of SLOTS.filter(s => !placed.has(s.id))) {
    const r = s.dia / 2 * K;
    const ring = new THREE.Mesh(new THREE.RingGeometry(r - 2.5, r, 64),
      new THREE.MeshBasicMaterial({ color: 0x7a0706, transparent: true, opacity: .6, depthWrite: false }));
    ring.rotation.x = -Math.PI / 2;
    ring.position.set(s.x * K, .6, s.z * K);
    markers.add(ring);
  }

  /* ── 전체 목록 ── */
  const listItems = document.getElementById('listItems');
  const rows = new Map();
  for (const s of SLOTS) {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.type = 'button';
    b.innerHTML = `<span class="ix">${s.index}</span><span class="ko">${s.ko}</span><span class="pj">${s.project}</span>`;
    b.addEventListener('pointerenter', () => hoverSlot(s.id, 0));
    b.addEventListener('pointerleave', () => hoverSlot(null));
    b.addEventListener('click', () => openSlot(s.id));
    li.appendChild(b); listItems.appendChild(li);
    rows.set(s.id, b);
  }
  /* menu 폴더 — 누르거나 Enter·Space 로 전체 목록을 열고 닫는다 */
  const menu = document.getElementById('menu');
  const toggleList = () => {
    const open = document.body.classList.toggle('listOpen');
    menu.setAttribute('aria-label', open ? '전체 목록 닫기' : '전체 목록 열기');
  };
  menu.addEventListener('click', toggleList);
  menu.addEventListener('keydown', ev => {
    if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggleList(); }
  });

  /* ── 호버 — 한 번에 하나만 반응한다 ── */
  let hovered = null, opening = false;                     // hovered = { id, i } (단추 자리는 둘 중 어느 쪽인지)
  function hoverSlot(id, i = 0) {
    if (opening) id = null;
    if (hovered?.id === id && hovered?.i === i) return;
    if (hovered) placed.get(hovered.id)?.[hovered.i]?.setHover(false);
    hovered = id ? { id, i } : null;
    if (hovered) placed.get(id)?.[i]?.setHover(true);
    document.body.classList.toggle('onObject', !!(hovered && placed.has(id)));
    for (const [rid, b] of rows) b.classList.toggle('on', rid === id);
  }

  function openSlot(id) {
    const o = placed.get(id)?.[0];
    if (!o?.open || opening) { if (id) console.log('열기:', id, slot(id)?.project); return; }
    opening = true;
    hoverSlot(null);
    o.open(() => { opening = false; });
  }

  /* ── 카메라 — 책상 뷰(0) ↔ 고개 든 뷰(1). 메인 장면과 같은 움직임 ── */
  function spring(value, stiffness, damping) { return { value, target: value, v: 0, stiffness, damping }; }
  const gaze = spring(0, 34, 11);                          // 살짝 묵직하게 — 목이 움직이는 무게감
  const V = k => ({ pos: VIEW[k].pos.map(n => n * K), target: VIEW[k].target.map(n => n * K), fov: VIEW[k].fov });
  const DESK = V('DESK'), RAISE = V('RAISE');
  const _p = new THREE.Vector3(), _q = new THREE.Vector3();
  let aspect = 16 / 9;
  function applyCamera() {
    const g = gaze.value, e = g * g * (3 - 2 * g);         // 부드럽게 시작하고 멈춤
    camera.position.copy(_p.fromArray(DESK.pos).lerp(_q.fromArray(RAISE.pos), e));
    camera.lookAt(_p.fromArray(DESK.target).lerp(_q.fromArray(RAISE.target), e));
    const base = DESK.fov + (RAISE.fov - DESK.fov) * e;
    /* 세로로 긴 화면에서도 책상 가로폭이 유지되도록 화각을 넓힌다 */
    const fov = aspect < 16 / 9 ? base * (16 / 9) / Math.max(aspect, .6) : base;
    if (Math.abs(camera.fov - fov) > 1e-3) { camera.fov = fov; camera.updateProjectionMatrix(); }
  }

  /* 커서를 화면 위쪽 26% 안으로 올리면 그 높이만큼 고개를 든다. 내리면 저절로 돌아온다 */
  const BAND = .26, DEAD = .02;
  const gazeFromY = y => Math.max(0, Math.min(1, ((1 - y / innerHeight) - (1 - BAND)) / (BAND - DEAD)));

  /* ── 빨간 점 커서 ── */
  const dot = document.getElementById('dot');
  let px = innerWidth / 2, py = innerHeight / 2, tx = px, ty = py;

  /* ── 마우스 ── */
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  const deskPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), deskPoint = new THREE.Vector3();
  const targets = [];
  for (const [id, list] of placed) list.forEach((o, i) => targets.push({ id, i, o }));

  addEventListener('pointermove', ev => {
    tx = ev.clientX; ty = ev.clientY;
    gaze.target = gazeFromY(ev.clientY);
    if (ev.target.closest?.('.listPanel, .menuBody, .menuTab, .menuText')) return;   // 목록 위에서는 목록이 호버를 맡는다

    const r = renderer.domElement.getBoundingClientRect();
    ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    let best = null;
    for (const t of targets) {
      const h = ray.intersectObject(t.o.hit, true)[0];
      if (h && (!best || h.distance < best.d)) best = { ...t, d: h.distance, p: h.point };
    }
    hoverSlot(best?.id ?? null, best?.i ?? 0);
    if (best?.o.lean) best.o.lean(ray.ray.intersectPlane(deskPlane, deskPoint) ? deskPoint : best.p);
  }, { passive: true });

  addEventListener('click', ev => {
    if (ev.target.closest?.('.listPanel, .menuBody, .menuTab, .menuText')) return;
    if (hovered) openSlot(hovered.id);
  });

  /* 화면 밖으로 나가면 고개를 내리고 호버를 푼다 */
  document.addEventListener('mouseleave', () => { gaze.target = 0; hoverSlot(null); });

  /* 휠 — 스케치대로 전체 목록이 옆에서 나온다 */
  addEventListener('wheel', ev => {
    if (ev.deltaY > 6) document.body.classList.add('listOpen');
    else if (ev.deltaY < -6) document.body.classList.remove('listOpen');
  }, { passive: true });

  /* 마우스가 없는 환경 — 방향키로도 고개를 든다. M 은 빈 자리 표시 */
  addEventListener('keydown', ev => {
    if (ev.key === 'ArrowUp')   gaze.target = Math.min(1, gaze.target + .3);
    if (ev.key === 'ArrowDown') gaze.target = Math.max(0, gaze.target - .3);
    if (ev.key.toLowerCase() === 'm') markers.visible = !markers.visible;
  });

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = aspect = w / h;
    camera.updateProjectionMatrix();
    /* 글자 묶음 비율 — Figma 프레임(1920 × 1080)이 화면에 들어가는 만큼 */
    document.documentElement.style.setProperty('--u', Math.min(innerWidth / 1920, innerHeight / 1080).toFixed(4));
  }
  new ResizeObserver(resize).observe(stage);
  resize();

  /* ── 루프 ───────────────────────────────────── */
  const gazeHint = document.getElementById('gazeHint'), gazeBar = document.getElementById('gazeBar');
  let prev = performance.now();
  renderer.setAnimationLoop(now => {
    const dt = Math.min((now - prev) / 1000, 1 / 30); prev = now;

    if (instant) { gaze.value = gaze.target; gaze.v = 0; }
    else { gaze.v += (gaze.stiffness * (gaze.target - gaze.value) - gaze.damping * gaze.v) * dt; gaze.value += gaze.v * dt; }
    applyCamera();

    sewing.update(dt);
    for (const list of placed.values()) for (const o of list) o.update(dt);

    px += (tx - px) * .3; py += (ty - py) * .3;
    dot.style.transform = `translate(${px.toFixed(1)}px, ${py.toFixed(1)}px)`;

    const g = gaze.value;
    document.body.style.setProperty('--gaze', g.toFixed(3));
    gazeBar.style.width = (g * 100) + '%';
    gazeHint.style.opacity = g > .85 ? .3 : 1;

    renderer.render(scene, camera);
  });
</script>
