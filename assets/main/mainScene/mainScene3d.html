<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Main Scene 뼈대</title>

<!--
  메인 화면 뼈대 확인용. 장면과 카메라는 mainScene.js 에 있다.
  · 오브젝트 자리에 마우스를 올리면 반응한다
  · 휠을 위로 굴리면 고개를 든다 — 책상 안쪽의 미싱·거울
  · 왼쪽 LIST 탭을 누르면 전체 목록이 나온다
  · D 키 — 구도 조절판 (값을 확정하면 mainScene.js 의 VIEW 에 옮긴다)
  주의: 정적 서버로 띄운다.  npx serve .
-->

<style>
  :root {
    --black: #171413; --red: #7A0706; --redHi: #C4140E; --cream: #EEEAE2;
    --faint: rgba(238, 234, 226, .42);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--black); color: var(--cream);
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    overflow: hidden; cursor: none;
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }

  /* ── 화면 위에 얹히는 글자 ── */
  .ui { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
  .ui > * { position: absolute; }

  /* 고개를 들면 책상 화면의 글자는 물러난다 — 다른 곳을 보고 있으니까 */
  .title, .brand { opacity: calc(1 - var(--gaze, 0) * .88); }

  .brand {
    top: calc(44px + env(safe-area-inset-top, 0px)); right: 54px; text-align: right;
  }
  .brand h2 {
    margin: 0 0 22px; font-size: 21px; letter-spacing: .3em; font-weight: 500;
    color: var(--cream);
  }
  .brand ol { margin: 0; padding: 0; list-style: none; font-size: 12px; line-height: 2.5; }
  .brand ol li { color: var(--faint); transition: color .25s; }
  .brand ol li b { color: var(--redHi); font-weight: 500; margin-right: 8px; }

  .title { left: 62px; bottom: calc(58px + env(safe-area-inset-bottom, 0px)); }
  .title .tag {
    display: inline-block; background: var(--cream); color: var(--black);
    font-size: 13px; letter-spacing: .06em; padding: 7px 17px; margin-bottom: 14px;
    /* 종이테이프처럼 위아래가 살짝 뜯긴 느낌 */
    clip-path: polygon(0 6%, 4% 0, 12% 7%, 22% 1%, 33% 8%, 46% 2%, 58% 8%, 70% 1%, 82% 7%, 93% 1%, 100% 7%,
                       100% 93%, 94% 100%, 84% 93%, 72% 99%, 60% 92%, 47% 99%, 35% 92%, 24% 99%, 13% 93%, 3% 100%, 0 94%);
    padding-block: 11px;
  }
  .title h1 {
    margin: 0; font-family: "Bodoni Moda", Georgia, serif; font-weight: 400;
    font-size: clamp(64px, 8.6vw, 132px); line-height: .88; letter-spacing: -.012em;
  }
  .title p { margin: 14px 0 0; font-size: 12.5px; color: var(--faint); letter-spacing: .02em; }

  /* ── 왼쪽 LIST 탭 — 스케치: 스크롤하면 리스트가 옆에서 나온다 ── */
  .listTab {
    left: 0; top: 50%; transform: translateY(-50%);
    pointer-events: auto; cursor: none;
    background: var(--cream); color: var(--black); border: 0;
    font-family: inherit; font-size: 11px; letter-spacing: .3em;
    padding: 22px 9px; writing-mode: vertical-rl;
    border-radius: 0 3px 3px 0;
  }
  .listPanel {
    left: 0; top: 0; height: 100%; width: 320px; max-width: 84vw;
    background: rgba(12, 10, 9, .93); border-right: 1px solid rgba(238,234,226,.14);
    padding: 44px 30px; pointer-events: auto; overflow-y: auto;
    transform: translateX(-100%); transition: transform .5s cubic-bezier(.2,.8,.25,1);
    backdrop-filter: blur(8px);
  }
  body.listOpen .listPanel { transform: translateX(0); }
  .listPanel h3 { margin: 0 0 4px; font-size: 11px; letter-spacing: .28em; color: var(--redHi); }
  .listPanel .note { margin: 0 0 26px; font-size: 10.5px; line-height: 1.9; color: var(--faint); }
  .listPanel ul { margin: 0; padding: 0; list-style: none; }
  .listPanel li { border-top: 1px solid rgba(238,234,226,.1); }
  .listPanel li:last-child { border-bottom: 1px solid rgba(238,234,226,.1); }
  .listPanel button {
    width: 100%; display: flex; gap: 12px; align-items: baseline;
    background: none; border: 0; color: inherit; font: inherit; cursor: none;
    padding: 14px 4px; text-align: left; transition: background .2s, padding .2s;
  }
  .listPanel button:hover, .listPanel button.on { background: rgba(196,20,14,.14); padding-left: 10px; }
  .listPanel .ix { font-size: 10px; color: var(--redHi); letter-spacing: .1em; }
  .listPanel .ko { font-size: 13px; }
  .listPanel .pj { font-size: 10px; color: var(--faint); margin-left: auto; }

  /* ── 고개 들기 안내 ── */
  .gaze {
    left: 50%; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    font-size: 10px; letter-spacing: .18em; color: var(--faint); text-align: center;
    transition: opacity .4s;
  }
  .gaze .bar { width: 120px; height: 1px; background: rgba(238,234,226,.18); margin: 9px auto 0; }
  .gaze .bar i { display: block; height: 100%; width: 0; background: var(--redHi); transition: width .12s linear; }

  /* ── 빨간 점 커서 ── */
  .dot {
    position: fixed; z-index: 9; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px;
    border-radius: 50%; background: var(--redHi); pointer-events: none;
    box-shadow: 0 0 14px rgba(196,20,14,.85);
    transition: width .2s, height .2s, margin .2s, background .2s, box-shadow .2s;
  }
  body.onObject .dot {
    width: 34px; height: 34px; margin: -17px 0 0 -17px;
    background: rgba(196,20,14,.16); box-shadow: 0 0 0 1px var(--redHi) inset;
  }

  /* ── 구도 조절판 (D) ── */
  .dev {
    right: 18px; bottom: 18px; width: 232px; pointer-events: auto;
    background: rgba(12,10,9,.92); border: 1px solid rgba(238,234,226,.16);
    padding: 14px; font-size: 10px; letter-spacing: .06em; display: none;
  }
  body.dev .dev { display: block; }
  .dev label { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; color: var(--faint); }
  .dev label span { width: 46px; }
  .dev input { flex: 1; accent-color: var(--redHi); }
  .dev output { width: 38px; text-align: right; color: var(--cream); }
  .dev button {
    width: 100%; margin-top: 8px; background: var(--cream); color: var(--black);
    border: 0; font: inherit; padding: 7px; cursor: none; letter-spacing: .1em;
  }
  .hint { right: 18px; bottom: 18px; font-size: 9.5px; letter-spacing: .16em; color: rgba(238,234,226,.28); }
  body.dev .hint { display: none; }

  @media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; } }
</style>

<div id="stage"></div>

<div class="ui">
  <div class="brand">
    <h2>KIM HAEUN</h2>
    <ol>
      <li><b>01</b>About ME</li>
      <li><b>02-05</b>UXUI Project</li>
      <li><b>06</b>package design</li>
      <li><b>07</b>ETC</li>
    </ol>
  </div>

  <div class="title">
    <div class="tag">UX/UI Designer</div>
    <h1>Portfolio</h1>
    <p>조각을 이어주는 프로덕트 디자이너 김하은.</p>
  </div>

  <button class="listTab" id="listTab">LIST</button>
  <nav class="listPanel" id="listPanel">
    <h3>전체 목록</h3>
    <p class="note">물건만으로는 어디를 눌러야 할지 모르는 사람을 위해<br>한곳에 다 적어둡니다. 누르면 해당 페이지로.</p>
    <ul id="listItems"></ul>
  </nav>

  <div class="gaze" id="gazeHint">
    커서를 화면 위로 — 고개를 듭니다
    <div class="bar"><i id="gazeBar"></i></div>
  </div>

  <div class="dev">
    <label><span>거리</span><input id="dDist" type="range" min="40" max="110" step="1"><output id="oDist"></output></label>
    <label><span>높이각</span><input id="dPol" type="range" min="10" max="70" step="1"><output id="oPol"></output></label>
    <label><span>화각</span><input id="dFov" type="range" min="18" max="50" step="1"><output id="oFov"></output></label>
    <label><span>바라봄</span><input id="dTgt" type="range" min="-14" max="14" step="1"><output id="oTgt"></output></label>
    <button id="dCopy">값 복사</button>
  </div>
  <div class="hint">D — 구도 조절</div>
</div>

<i class="dot" id="dot"></i>

<script type="module">
  import { createMainScene, SLOTS } from './mainScene.js';
  import { createThreadSpool } from '../threadSpool/threadSpool.js';
  import { createRedButton, createCreamButton, createButtonRig } from '../button/buttonFinal.js';
  import { createTapeMeasure } from '../tapeMeasure/tapeMeasure.js';

  const stage = document.getElementById('stage');
  const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  stage.appendChild(renderer.domElement);

  const main = createMainScene(THREE, renderer);
  let needsRender = true;                           // 움직임이 없으면 다시 그리지 않는다
  window.mainScene = main;                          // 구도 확인용 — 콘솔에서 카메라를 들여다본다

  /* ── 완성된 오브젝트를 자리에 꽂는다 ──────────────────
     placement() 가 슬롯의 좌표와 크기를 계산해 넘긴다.
     두 번째 인자는 그 모델의 기준 반지름 — 실패는 길쭉해서 끝판 반지름 대신
     전체 길이가 자리에 맞도록 1.27 로 잡았다 */
  main.attach('threadSpool', createThreadSpool(THREE, main.scene, {
    ...main.placement('threadSpool', 1.27), turn: -.35
  }));
  /* 단추 자리에는 빨간 단추와 꽃단추가 함께 놓인다.
     배열로 넘기면 둘이 따로 걸려서 올린 쪽만 반응한다 */
  const bp = main.placement('button');
  main.attach('button', [
    createButtonRig(THREE, main.scene, createRedButton(THREE), { ...bp, spin: .3 }),
    createButtonRig(THREE, main.scene, createCreamButton(THREE), {
      x: bp.x + bp.size * 1.2, z: bp.z + bp.size * 2.6, size: bp.size * .8, spin: 1.1
    })
  ]);

  main.attach('tapeMeasure', createTapeMeasure(THREE, main.scene, {
    ...main.placement('tapeMeasure'), turn: -.5
  }));

  /* ── 전체 목록 채우기 ── */
  const listItems = document.getElementById('listItems');
  const rows = new Map();
  for (const s of SLOTS) {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.type = 'button';
    b.innerHTML = `<span class="ix">${s.index}</span><span class="ko">${s.ko}</span><span class="pj">${s.project}</span>`;
    b.addEventListener('pointerenter', () => setHover(s.id, true));
    b.addEventListener('pointerleave', () => setHover(s.id, false));
    li.appendChild(b); listItems.appendChild(li);
    rows.set(s.id, b);
  }
  function setHover(id, on) {                       // 목록과 장면이 같이 반응한다
    const slot = main.slots.get(id);
    if (!slot) return;
    slot.hover.target = on ? 1 : 0;
    slot.object?.setHover?.(on);
    rows.get(id)?.classList.toggle('on', on);
    needsRender = true;
  }

  document.getElementById('listTab').addEventListener('click', () => {
    document.body.classList.toggle('listOpen');
  });

  /* ── 빨간 점 커서 ── */
  const dot = document.getElementById('dot');
  let px = innerWidth / 2, py = innerHeight / 2, tx = px, ty = py, cursorRaf = 0;
  function cursorLoop() {
    px += (tx - px) * .3; py += (ty - py) * .3;
    dot.style.transform = `translate(${px.toFixed(1)}px, ${py.toFixed(1)}px)`;
    cursorRaf = (Math.abs(tx - px) > .4 || Math.abs(ty - py) > .4) ? requestAnimationFrame(cursorLoop) : 0;
  }

  /* ── 고개 들기 — 커서를 화면 위쪽으로 가져가면 그 높이만큼 들린다 ──
     위쪽 26% 안으로 들어오면 시작해서 맨 위에 닿으면 완전히 든다.
     게임처럼 커서를 따라 계속 움직이고, 내리면 저절로 돌아온다 */
  const BAND = .26, DEAD = .02;
  function gazeFromY(clientY) {
    const f = 1 - clientY / innerHeight;                 // 0 아래 … 1 위
    const t = (f - (1 - BAND)) / (BAND - DEAD);
    return Math.max(0, Math.min(1, t));
  }

  /* ── 마우스 — 장면 호버 판정 + 고개 들기 ── */
  addEventListener('pointermove', ev => {
    tx = ev.clientX; ty = ev.clientY;
    if (!cursorRaf) cursorRaf = requestAnimationFrame(cursorLoop);

    main.setGaze(gazeFromY(ev.clientY));

    const r = renderer.domElement.getBoundingClientRect();
    const changed = main.pick(
      ((ev.clientX - r.left) / r.width) * 2 - 1,
      -((ev.clientY - r.top) / r.height) * 2 + 1
    );
    if (changed !== undefined) {
      document.body.classList.toggle('onObject', !!changed);
      for (const [id, b] of rows) b.classList.toggle('on', id === changed);
    }
    needsRender = true;
  }, { passive: true });

  /* 화면 밖으로 나가면 고개를 내린다 */
  addEventListener('pointerleave', () => { main.setGaze(0); needsRender = true; });
  document.addEventListener('mouseleave', () => { main.setGaze(0); needsRender = true; });

  addEventListener('click', () => {
    const id = main.hovered;
    if (id) console.log('열기:', id, SLOTS.find(s => s.id === id)?.project);
  });

  /* ── 휠 — 스케치대로 전체 목록이 옆에서 나온다 ── */
  const gazeHint = document.getElementById('gazeHint'), gazeBar = document.getElementById('gazeBar');
  addEventListener('wheel', ev => {
    if (ev.deltaY > 6) document.body.classList.add('listOpen');
    else if (ev.deltaY < -6) document.body.classList.remove('listOpen');
  }, { passive: true });

  /* 마우스가 없는 환경 — 방향키로도 고개를 든다 */
  addEventListener('keydown', ev => {
    if (ev.key === 'ArrowUp')   { main.nudgeGaze(.3);  needsRender = true; }
    if (ev.key === 'ArrowDown') { main.nudgeGaze(-.3); needsRender = true; }
    if (ev.key.toLowerCase() === 'd') document.body.classList.toggle('dev');
  });

  /* ── 구도 조절판 — 값을 정하면 mainScene.js 의 VIEW.DESK 에 옮긴다 ── */
  const dev = {
    dist: 67, pol: 32, fov: 30, tgt: 0,
    els: ['Dist', 'Pol', 'Fov', 'Tgt'].map(k => [document.getElementById('d' + k), document.getElementById('o' + k)])
  };
  function applyDev() {
    const rad = dev.pol * Math.PI / 180;
    main.camera.position.set(0, dev.dist * Math.cos(rad), dev.dist * Math.sin(rad));
    main.camera.lookAt(0, dev.tgt, 0);
    main.camera.fov = dev.fov; main.camera.updateProjectionMatrix();
    needsRender = true;
  }
  ['dist', 'pol', 'fov', 'tgt'].forEach((k, i) => {
    const [input, out] = dev.els[i];
    input.value = dev[k]; out.textContent = dev[k];
    input.addEventListener('input', () => {
      dev[k] = Number(input.value); out.textContent = input.value;
      if (document.body.classList.contains('dev')) applyDev();
    });
  });
  document.getElementById('dCopy').addEventListener('click', () => {
    const rad = dev.pol * Math.PI / 180;
    const txt = `DESK: { pos: [0, ${(dev.dist * Math.cos(rad)).toFixed(1)}, ${(dev.dist * Math.sin(rad)).toFixed(1)}], target: [0, ${dev.tgt}, 0], fov: ${dev.fov} }`;
    navigator.clipboard?.writeText(txt);
    console.log(txt);
  });

  /* ── 크기 ── */
  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    main.resize(w, h);
    needsRender = true;
  }
  new ResizeObserver(resize).observe(stage);
  resize();

  /* ── 루프 ── */
  let prev = performance.now();
  renderer.setAnimationLoop(now => {
    const dt = Math.min((now - prev) / 1000, 1 / 30); prev = now;
    const moving = main.update(dt);
    if (document.body.classList.contains('dev')) applyDev();
    if (moving || needsRender) {
      renderer.render(main.scene, main.camera);
      needsRender = false;
      const g = main.gaze;
      document.body.style.setProperty('--gaze', g.toFixed(3));
      gazeBar.style.width = (g * 100) + '%';
      gazeHint.style.opacity = g > .85 ? .3 : 1;
    }
  });
</script>
