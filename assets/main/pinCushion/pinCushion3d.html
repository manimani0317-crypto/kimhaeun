<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pin Cushion 3D</title>

<!--
  바늘꽂이 3D 확인용 페이지. 모델은 pinCushion.js 에 있다.
  드래그로 돌려 보고, 휠로 확대한다.
  주의: type="module" 이라 file:// 로 바로 열면 안 된다. 정적 서버로 띄운다.
-->

<style>
  :root { --black: #171413; --faint: rgba(238, 234, 226, .42); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--black); font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; overflow: hidden; }
  #stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
  #stage.isDragging { cursor: grabbing; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  .caption {
    position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%); margin: 0;
    font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--faint); pointer-events: none; white-space: nowrap;
  }
</style>

<div id="stage"></div>
<p class="caption">Drag to orbit · Scroll to zoom</p>

<script type="module">
  import { createPinCushion } from './pinCushion.js';

  const stage = document.getElementById('stage');
  const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(30, 1, .1, 100);

  /* 스튜디오 반사 */
  (function environment() {
    const c = document.createElement('canvas');
    c.width = 64; c.height = 256;
    const g = c.getContext('2d');
    const gr = g.createLinearGradient(0, 0, 0, 256);
    gr.addColorStop(0, '#6a6460'); gr.addColorStop(.3, '#fff8ee');
    gr.addColorStop(.45, '#8a8480'); gr.addColorStop(.65, '#2a2624'); gr.addColorStop(1, '#0e0c0c');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 256);
    const tex = new THREE.CanvasTexture(c);
    tex.mapping = THREE.EquirectangularReflectionMapping;
    const pm = new THREE.PMREMGenerator(renderer);
    scene.environment = pm.fromEquirectangular(tex).texture;
    pm.dispose(); tex.dispose();
  })();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x3a3230, .5));
  const key = new THREE.DirectionalLight(0xfff2e4, 2.2);
  key.position.set(-3, 6, 4);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xffffff, .8);
  rim.position.set(3, 3, -4);
  scene.add(rim);

  const model = createPinCushion(THREE);
  scene.add(model);

  /* 바닥 그림자 — 방사형 그라데이션 한 장 */
  const shadow = new THREE.Mesh(
    new THREE.PlaneGeometry(1, 1),
    new THREE.MeshBasicMaterial({
      transparent: true, depthWrite: false,
      map: new THREE.CanvasTexture((() => {
        const c = document.createElement('canvas'); c.width = c.height = 128;
        const g = c.getContext('2d'), r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
        r.addColorStop(0, 'rgba(0,0,0,.85)'); r.addColorStop(.6, 'rgba(0,0,0,.4)'); r.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = r; g.fillRect(0, 0, 128, 128); return c;
      })())
    })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.scale.set(4.6, 2.8, 1);
  shadow.position.y = -.01;
  scene.add(shadow);

  /* ── 시점 — 드래그로 돌리고 휠로 확대. 만지기 전엔 천천히 돈다 ── */
  const target = new THREE.Vector3(0, .75, 0);
  const cam = { az: 0, pol: 1.42, dist: 8.5 };
  /* 주소에 ?az=각도(도) 를 붙이면 그 방향에서 멈춰 보여 준다. 0 정면, 90 오른쪽 옆면, -90 왼쪽 옆면 */
  const q = new URLSearchParams(location.search);
  if (q.has('az')) cam.az = Number(q.get('az')) * Math.PI / 180;
  let idle = !q.has('az') && !matchMedia('(prefers-reduced-motion: reduce)').matches;
  function place() {
    cam.pol = Math.max(.15, Math.min(Math.PI - .15, cam.pol));
    cam.dist = Math.max(4, Math.min(16, cam.dist));
    camera.position.set(
      target.x + cam.dist * Math.sin(cam.pol) * Math.sin(cam.az),
      target.y + cam.dist * Math.cos(cam.pol),
      target.z + cam.dist * Math.sin(cam.pol) * Math.cos(cam.az));
    camera.lookAt(target);
  }
  let drag = null;
  stage.addEventListener('pointerdown', e => { drag = [e.clientX, e.clientY]; idle = false; stage.setPointerCapture(e.pointerId); stage.classList.add('isDragging'); });
  stage.addEventListener('pointermove', e => {
    if (!drag) return;
    cam.az -= (e.clientX - drag[0]) * .008; cam.pol -= (e.clientY - drag[1]) * .008;
    drag = [e.clientX, e.clientY]; place();
  });
  const end = () => { drag = null; stage.classList.remove('isDragging'); };
  stage.addEventListener('pointerup', end); stage.addEventListener('pointercancel', end);
  stage.addEventListener('wheel', e => { e.preventDefault(); idle = false; cam.dist *= 1 + Math.sign(e.deltaY) * .08; place(); }, { passive: false });

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = w / h < 1 ? 30 / Math.max(w / h, .5) : 30;
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage);
  resize(); place();

  let prev = performance.now();
  renderer.setAnimationLoop(now => {
    const dt = Math.min((now - prev) / 1000, 1 / 30); prev = now;
    if (idle) { cam.az += dt * .25; place(); }
    renderer.render(scene, camera);
  });
</script>
