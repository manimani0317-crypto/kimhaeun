<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thread Spool 3D</title>

<!--
  실패 3D 확인용 페이지. 모델과 인터랙션은 threadSpool.js 에 있다.
  마우스를 올리면 앞으로 살짝 구르고, 떼면 돌아온다.
  ?az=각도 를 붙이면 그 방향에서 본다 (0 = 정면). 주의: 정적 서버로 띄운다.
-->

<style>
  :root { --black: #171413; --faint: rgba(238, 234, 226, .42); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--black); font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  .caption {
    position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%); margin: 0;
    font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--faint); pointer-events: none; white-space: nowrap;
  }
</style>

<div id="stage"></div>
<p class="caption">Hover the spool</p>

<script type="module">
  import { createThreadSpool } from './threadSpool.js';

  const stage = document.getElementById('stage');
  const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = .9;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(30, 1, .1, 100);

  (function environment() {
    const c = document.createElement('canvas');
    c.width = 64; c.height = 256;
    const g = c.getContext('2d');
    const gr = g.createLinearGradient(0, 0, 0, 256);
    gr.addColorStop(0, '#6a6460'); gr.addColorStop(.3, '#fff8ee');
    gr.addColorStop(.45, '#8a8480'); gr.addColorStop(.65, '#2a2624'); gr.addColorStop(1, '#0e0c0c');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 256);
    const tex = new THREE.CanvasTexture(c);
    tex.mapping = THREE.EquirectangularReflectionMapping;
    const pm = new THREE.PMREMGenerator(renderer);
    scene.environment = pm.fromEquirectangular(tex).texture;
    pm.dispose(); tex.dispose();
  })();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x1a1414, .12));   // 주변광은 아주 약하게 — 대비가 살도록
  /* 주 조명은 위쪽 약간 뒤에서 — 윗면은 밝고, 앞쪽 아래로 돌아가는 면은 깊게 어두워진다 */
  const key = new THREE.DirectionalLight(0xfff2e4, 4.6);
  key.position.set(-3, 7, -1.5);
  const fill = new THREE.DirectionalLight(0xffe8e0, .35);         // 앞쪽이 완전히 묻히지 않을 만큼만
  fill.position.set(2, 2, 6);
  scene.add(fill);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xffffff, .35);
  rim.position.set(3, 3, -4);
  scene.add(rim);

  const spool = createThreadSpool(THREE, scene, { x: -.6, z: -.5 });

  /* 시점 — 책상을 위에서 비스듬히 */
  const q = new URLSearchParams(location.search);
  const az = (q.has('az') ? Number(q.get('az')) : 20) * Math.PI / 180;
  const pol = 1.05, dist = 9.5;
  const target = new THREE.Vector3(.1, .5, .5);
  camera.position.set(
    target.x + dist * Math.sin(pol) * Math.sin(az),
    target.y + dist * Math.cos(pol),
    target.z + dist * Math.sin(pol) * Math.cos(az));
  camera.lookAt(target);

  /* 호버 */
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  let hovered = false;
  stage.addEventListener('pointermove', ev => {
    const r = renderer.domElement.getBoundingClientRect();
    ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const on = ray.intersectObject(spool.hitTarget, true).length > 0;
    if (on !== hovered) { hovered = on; spool.setHover(on); stage.style.cursor = on ? 'pointer' : 'default'; }
  });
  stage.addEventListener('pointerleave', () => { hovered = false; spool.setHover(false); });

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = w / h < 1 ? 30 / Math.max(w / h, .5) : 30;
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage);
  resize();

  let prev = performance.now();
  renderer.setAnimationLoop(now => {
    const dt = Math.min((now - prev) / 1000, 1 / 30); prev = now;
    spool.update(dt);
    renderer.render(scene, camera);
  });
</script>
